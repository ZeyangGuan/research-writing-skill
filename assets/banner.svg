<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Research Writing Skill — Make the research clear.</title>
  <desc id="desc">An original editorial banner on warm ivory. A large serif headline is followed by three areas of revision: sentences, structure, and wording.</desc>
  <rect width="1200" height="440" fill="#f7f4ed"/>
  <path d="M52 44H1148" stroke="#233036" stroke-width="2"/>
  <path d="M52 44H140" stroke="#a43d2d" stroke-width="6"/>
  <text x="52" y="85" fill="#233036" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3">RESEARCH WRITING SKILL</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="100" letter-spacing="-3">
    <text x="47" y="211" fill="#233036">Make the research</text>
    <text x="47" y="311" fill="#a43d2d">clear.</text>
  </g>
  <text x="373" y="291" fill="#4b565b" font-family="Arial, Helvetica, sans-serif" font-size="26">A practical guide to revising English papers.</text>
  <path d="M52 355H1148" stroke="#c6c9c5"/>
  <g fill="#233036" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <text x="52" y="399">Sentences</text>
    <text x="222" y="399">Structure</text>
    <text x="378" y="399">Wording</text>
  </g>
  <g fill="#a43d2d"><circle cx="194" cy="391" r="2.5"/><circle cx="350" cy="391" r="2.5"/></g>
  <text x="1148" y="399" text-anchor="end" fill="#4b565b" font-family="Arial, Helvetica, sans-serif" font-size="22">Sentence by sentence.</text>
</svg>
