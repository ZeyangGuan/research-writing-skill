<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Writing — editable workflow animation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e7e3;color:#263338;font-family:Arial,Helvetica,sans-serif}#stage{max-width:1120px;margin:0 auto}svg{display:block;width:100%;height:auto}nav{max-width:1120px;margin:20px auto;padding:0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select,input{font:inherit}button,select{padding:9px 14px}input{flex:1;min-width:100px}#time{font-variant-numeric:tabular-nums}body.capture{background:#f4f1e9}body.capture nav{display:none}body.capture #stage{max-width:none}
</style></head><body><div id="stage" aria-label="An original paragraph revised step by step"></div><nav aria-label="Animation preview controls"><button id="toggle">Pause</button><button id="restart">Restart</button><label>Layout <select id="layout"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select></label><input id="seek" type="range" min="0" max="42" step="0.1" value="0" aria-label="Animation time"><span id="time">0.0 / 42 s</span></nav>
<script>
// Original teaching example. Each state matches examples/workflow.md.
// Preserve the claims and research progression, not a fixed sentence count.
const DRAFT = [
 "We use a shared encoder to perform the extraction of a feature map.",
 "For the scoring head, this map is the input used to assign a score to each region.",
 "It is important to note that the encoder is frozen.",
 "We train the head on labeled regions.",
 "We evaluate the head on held-out regions.",
 "The head improves accuracy, but it increases latency."
];
const STAGES = [
 [
  "We use a shared encoder to extract a feature map.",
  "The scoring head uses this map to assign a score to each region.",
  "It is important to note that the encoder is frozen.",
  "We train the head on labeled regions.",
  "We evaluate the head on held-out regions.",
  "The head improves accuracy, but it increases latency."
 ],
 [
  "A shared, frozen encoder extracts a feature map.",
  "The scoring head uses this map to assign a score to each region.",
  "We train the head on labeled regions.",
  "We evaluate the head on held-out regions.",
  "The head improves accuracy, but it increases latency."
 ],
 [
  "A shared, frozen encoder extracts a feature map that the scoring head uses to assign a score to each region.",
  "We train the head on labeled regions.",
  "We evaluate the head on held-out regions.",
  "The head improves accuracy, but it increases latency."
 ],
 [
  "A shared, frozen encoder extracts a feature map that the scoring head uses to assign a score to each region.",
  "We train the head on labeled regions and evaluate it on held-out regions.",
  "The head improves accuracy, but it increases latency."
 ],
 [
  "A shared, frozen encoder extracts a feature map that the scoring head uses to assign a score to each region.",
  "We train the head on labeled regions and evaluate it on held-out regions.",
  "The head improves accuracy but increases latency."
 ]
];
const FINAL = [
 "A shared, frozen encoder extracts a feature map that the scoring head uses to assign a score to each region.",
 "We train the head on labeled regions and evaluate it on held-out regions.",
 "The head improves accuracy but increases latency."
];
const DURATION=42,FINAL_START=34;
const scenes=[
 {at:0,end:2,key:'input',title:'A paragraph needs a path.',sub:'Keep the claims. Let related facts work together.',label:'INPUT',note:'Read for the relationships.',detail:'Method → protocol → result.'},
 {at:2,end:7,key:'actions',title:'Make the actions explicit.',sub:'Name what the encoder and scoring head do.',label:'1 / ACTIONS',note:'Use precise subjects and verbs.',detail:'Extract a feature map; assign a score.',change:0,transition:3.2},
 {at:7,end:13,key:'state',title:'Keep the state with its object.',sub:'“Frozen” belongs beside the encoder here.',label:'2 / STATE',note:'A shared, frozen encoder…',detail:'The state stays with the object it describes.',change:1,transition:8.5},
 {at:13,end:21,key:'interface',title:'Complete the interface.',sub:'Carry the feature map straight into its use.',label:'3 / RELATION',note:'One sentence completes the relation.',detail:'encoder → feature map → scoring head → score',change:2,transition:14.5},
 {at:21,end:29,key:'protocol',title:'Make one protocol sentence.',sub:'Pair the actions, keeping both data conditions.',label:'4 / PROTOCOL',note:'Different actions can share a sentence.',detail:'labeled regions / held-out regions',change:3,transition:22.5},
 {at:29,end:34,key:'result',title:'Let the result land.',sub:'Give the benefit and cost one closing sentence.',label:'5 / RESULT',note:'End on the trade-off.',detail:'Accuracy improves; latency increases.',change:4,transition:30.2},
 {at:34,end:42,key:'final',title:'The paragraph, ready to use.',sub:'An interface, a protocol, then a result.',label:'FINAL',note:'Related facts form complete thoughts.',detail:'Meaning preserved. Sentence boundaries improved.'}
];
const keyframes=[0,0.8,2.7,4.4,7.6,9.7,13.6,15.8,18.8,21.6,23.8,27.2,29.5,31.4,36,40];
const COLOR={paper:'#fffefa',bg:'#f4f1e9',ink:'#263338',muted:'#5c676b',rule:'#d1d3ca',edit:'#216b68',editBg:'#e0eeea',cut:'#a34331',cutBg:'#f3e4dc',keep:'#3c6550',keepBg:'#e3ebdf'};
const measure=document.createElement('canvas').getContext('2d');
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const clamp=n=>Math.max(0,Math.min(1,n));const ease=n=>{n=clamp(n);return n*n*(3-2*n)};
const normal=s=>s.toLowerCase().replace(/^[^a-z]+|[^a-z-]+$/g,'');
const text=(x,y,s,size=22,fill=COLOR.ink,extra='')=>`<text x="${x}" y="${y}" font-family="Arial,Helvetica,sans-serif" font-size="${size}" fill="${fill}" ${extra}>${escape(s)}</text>`;
const line=(x1,y1,x2,y2,color=COLOR.rule,width=1)=>`<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${width}"/>`;
function wrap(s,width,size,font='Arial'){
 measure.font=`${size}px ${font}`;const rows=[];let row='';
 for(const word of s.split(' ')){const next=row?row+' '+word:word;if(row&&measure.measureText(next).width>width){rows.push(row);row=word}else row=next}if(row)rows.push(row);return rows;
}
function lcs(a,b){
 const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
 for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 let i=0,j=0;const pairs=[];while(i<a.length&&j<b.length){if(a[i]===b[j]){pairs.push([i,j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}return pairs;
}
let unique=0;
function tokenize(sentences){return sentences.flatMap((s,si)=>s.split(' ').map((word,wi)=>({word,si,wi})));}
const versions=[tokenize(DRAFT).map(w=>({...w,id:'w'+unique++}))];
for(const sentences of STAGES){
 const prev=versions.at(-1),next=tokenize(sentences),pairs=lcs(prev.map(w=>normal(w.word)),next.map(w=>normal(w.word)));
 const match=new Map(pairs.map(([a,b])=>[b,a])),used=new Set(pairs.map(([a])=>a));
 // Reuse an unambiguous moved token, such as “frozen”, across sentence boundaries.
 for(let j=0;j<next.length;j++)if(!match.has(j)){
  const candidates=prev.map((w,i)=>({w,i})).filter(({w,i})=>!used.has(i)&&normal(w.word)===normal(next[j].word));
  if(candidates.length===1){match.set(j,candidates[0].i);used.add(candidates[0].i);}
 }
 versions.push(next.map((w,j)=>({...w,id:match.has(j)?prev[match.get(j)].id:'w'+unique++})));
}
function positions(version,g){
 measure.font=`${g.font}px Georgia`;const space=measure.measureText(' ').width;let x=g.x,y=g.y;
 return version.map(token=>{const w=measure.measureText(token.word).width;if(x+w>g.x+g.width){x=g.x;y+=g.leading}const result={...token,x,y,w};x+=w+space;return result;});
}
function token(t,font,opacity=1,fill=COLOR.ink,highlight=null,strike=0){
 const bg=highlight?`<rect x="${t.x-2}" y="${t.y-font+2}" width="${t.w+4}" height="${font+7}" rx="3" fill="${highlight}"/>`:'';
 return `<g opacity="${opacity}">${bg}<text x="${t.x}" y="${t.y}" font-family="Georgia,'Times New Roman',serif" font-size="${font}" fill="${fill}">${escape(t.word)}</text>${strike?line(t.x,t.y-font*.29,t.x+t.w*strike,t.y-font*.29,COLOR.cut,2):''}</g>`;
}
function focus(w,scene,after){
 if(scene.key==='actions')return w.si<2;
 if(scene.key==='state')return after?w.si===0:w.si===2;
 if(scene.key==='interface')return after?w.si===0:w.si<2;
 if(scene.key==='protocol')return after?w.si===1:[1,2].includes(w.si);
 if(scene.key==='result')return w.si===2;
 return false;
}
function retained(w,scene){
 const word=normal(w.word);
 return scene.key==='state'&&word==='frozen'||scene.key==='protocol'&&['labeled','held-out'].includes(word)||scene.key==='result'&&['accuracy','latency'].includes(word);
}
function draw(t,layout='desktop'){
 t=Math.max(0,Math.min(DURATION-.001,t));const mobile=layout==='mobile',W=mobile?640:1120,H=mobile?1180:800;
 const g=mobile?{x:48,y:331,width:544,font:34,leading:48}:{x:72,y:293,width:976,font:32,leading:45};
 const index=Math.max(0,scenes.findIndex(s=>t>=s.at&&t<s.end)),scene=scenes[index];
 const changes=scenes.filter(s=>s.change!==undefined),level=changes.filter(s=>t>=s.transition).length;
 const active=changes.find(s=>t>=s.transition&&t<s.transition+1.05),after=scene.transition!==undefined&&t>=scene.transition;
 const headingSize=mobile?43:46,titleLines=wrap(scene.title,W-88,headingSize);
 let out=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="title desc"><title id="title">Research Writing — ${escape(scene.title)}</title><desc id="desc">Original teaching example. Five edits organize a method, protocol, and result into a coherent paragraph while retaining the claims and conditions.</desc><rect width="${W}" height="${H}" fill="${COLOR.bg}"/>`;
 out+=text(44,40,'RESEARCH WRITING / A WORKED EXAMPLE',mobile?19:18,COLOR.muted,'letter-spacing="1.3"');
 titleLines.forEach((s,i)=>out+=text(44,(mobile?98:108)+i*(headingSize+7),s,headingSize));
 wrap(scene.sub,W-88,mobile?25:24).forEach((s,i)=>out+=text(44,(mobile?194:149)+i*33,s,mobile?25:24,COLOR.muted));
 const py=mobile?258:199,ph=mobile?698:439;
 out+=`<rect x="${mobile?24:32}" y="${py}" width="${W-(mobile?48:64)}" height="${ph}" fill="${COLOR.paper}" stroke="${COLOR.rule}"/>`;
 out+=text(g.x,py+35,scene.key==='final'?'REVISED PARAGRAPH':'DRAFT / EDITING FOR FLOW',mobile?19:17,COLOR.muted,'letter-spacing="1.2"');
 const progress=clamp(t/FINAL_START),trackY=mobile?239:182;
 out+=line(44,trackY,W-44,trackY,COLOR.rule,2)+line(44,trackY,44+(W-88)*progress,trackY,COLOR.edit,3);
 for(let k=0;k<scenes.length;k++)out+=`<circle cx="${44+(W-88)*(scenes[k].at/FINAL_START)}" cy="${trackY}" r="${k===index?4.5:2.5}" fill="${t>=scenes[k].at?COLOR.edit:COLOR.rule}"/>`;
 let items=positions(versions[level],g);
 if(active){
  const p=ease((t-active.transition)/1.05),before=positions(versions[active.change],g),next=positions(versions[active.change+1],g);
  const a=new Map(before.map(w=>[w.id,w])),b=new Map(next.map(w=>[w.id,w]));
  for(const old of before){const nw=b.get(old.id);if(nw)out+=token({...nw,x:old.x+(nw.x-old.x)*p,y:old.y+(nw.y-old.y)*p},g.font,1,retained(nw,scene)?COLOR.keep:COLOR.ink,retained(nw,scene)?COLOR.keepBg:null);else out+=token({...old,y:old.y-8*p},g.font,1-p,COLOR.cut,COLOR.cutBg,1);}
  for(const nw of next)if(!a.has(nw.id))out+=token({...nw,y:nw.y+10*(1-p)},g.font,p,COLOR.edit,COLOR.editBg);
  items=next;
 }else{
  const nextIds=scene.change!==undefined?new Set(versions[scene.change+1].map(w=>w.id)):null;
  for(const w of items){
   const removed=!after&&nextIds&&!nextIds.has(w.id),keep=retained(w,scene),emphasis=focus(w,scene,after);
   const bg=keep?COLOR.keepBg:removed?COLOR.cutBg:emphasis?COLOR.editBg:null;
   out+=token(w,g.font,1,keep?COLOR.keep:removed?COLOR.cut:COLOR.ink,bg,removed?ease((t-scene.at-.3)/.6):0);
  }
 }
 // The interface ends on the head's output; the established head carries into the protocol.
 if(scene.key==='interface'&&t>=17.5){
  for(const w of items.filter(w=>normal(w.word)==='head'&&w.si<=1))out+=line(w.x,w.y+7,w.x+w.w,w.y+7,COLOR.edit,3);
 }
 const fy=mobile?1000:684;
 out+=text(44,fy,scene.label,mobile?21:18,COLOR.edit,'font-weight="700" letter-spacing="2"');
 wrap(scene.note,W-88,mobile?28:27).forEach((s,i)=>out+=text(44,(mobile?1046:720)+i*35,s,mobile?28:27));
 wrap(scene.detail,W-88,mobile?22:21).forEach((s,i)=>out+=text(44,(mobile?1138:762)+i*28,s,mobile?22:21,COLOR.muted));
 out+='</svg>';document.getElementById('stage').innerHTML=out;
 window.lastFrame={time:t,layout,scene:scene.key,version:level,width:W,height:H,lastTextBaseline:items.at(-1).y,paperBottom:py+ph,paragraph:versions[level].map(w=>w.word).join(' ')};
 return out;
}
window.workflow={draw,scenes,draft:DRAFT,stages:STAGES,final:FINAL,duration:DURATION,finalStart:FINAL_START,keyframes};
const params=new URLSearchParams(location.search);let layout=params.get('layout')||'desktop';
if(params.has('capture'))document.body.classList.add('capture');
const select=document.getElementById('layout');select.value=layout;
let playing=!params.has('capture')&&!matchMedia('(prefers-reduced-motion: reduce)').matches,t=playing?0:FINAL_START+1,last=performance.now();
const button=document.getElementById('toggle');button.textContent=playing?'Pause':'Play';
function frame(now){if(playing)t=(t+(now-last)/1000)%DURATION;last=now;draw(t,layout);document.getElementById('seek').value=t;document.getElementById('time').textContent=t.toFixed(1)+' / '+DURATION+' s';requestAnimationFrame(frame)}
if(!params.has('capture'))requestAnimationFrame(frame);else draw(Number(params.get('t')||0),layout);
button.onclick=()=>{playing=!playing;last=performance.now();button.textContent=playing?'Pause':'Play'};
document.getElementById('restart').onclick=()=>{t=0;playing=true;last=performance.now();button.textContent='Pause'};
select.onchange=()=>{layout=select.value;draw(t,layout)};
document.getElementById('seek').oninput=e=>{t=Number(e.target.value);playing=false;button.textContent='Play';draw(t,layout)};
</script></body></html>
